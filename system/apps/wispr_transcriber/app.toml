name = "wispr-transcriber"
display_name = "Wispr Transcriber"
description = "Turn speech into text through your own Wispr Flow account: upload a recording or have your Mac speak one, and see both the word-for-word transcript and Wispr's cleaned-up version."
icon = "icon.svg"
priority = "user"
program = "wispr-transcriber"
stop_when_no_windows = true

[[references]]
path = ".agents/skills/local-print-bridge"
note = "deskrun, the one-command channel to the Mac that this app uses to copy the Wispr Flow sign-in."

# How update-app boots a throwaway preview of this app: on a free port, over a
# scratch copy of its data.
[preview]
env = {WISPR_TRANSCRIBER_PORT = "{port:main}", WISPR_TRANSCRIBER_DATA_DIR = "{copy:data}"}
copies = {data = "data/.apps/wispr-transcriber"}
