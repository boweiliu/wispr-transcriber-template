[project]
name = "wispr-transcriber"
version = "0.1.0"
description = "Turn speech into text through your own Wispr Flow account, from this workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "werkzeug>=3.0",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.scripts]
wispr-transcriber = "wispr_transcriber.runner:main"
wispr-transcribe = "wispr_transcriber.cli:main"
wispr-mac-link = "wispr_transcriber.mac_link:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_transcriber"]

[dependency-groups]
dev = ["pytest>=8", "ty==0.0.14"]

[project.optional-dependencies]
# grpcio-tools is only needed to regenerate flow_api_pb2*.py from the .proto; see docs/design.md.
test = ["pytest>=8"]

[tool.ty]

[tool.pytest.ini_options]
markers = [
    "browser: exercises the app in a real browser",
    "mac: needs a live connection to the user's Mac",
    "live: calls Wispr Flow's real servers",
]
